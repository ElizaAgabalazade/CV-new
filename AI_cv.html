<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/AI_CVI.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="./js/Aİ_CV.js" defer></script>
    <title>Document</title>
</head>

<body>
    <header>
        <div class="logo">
            <img src="./img/logo155.png" alt="" class="bubble">
            <img src="./img/CV Maker..png" alt="" class="word">
            <img src="./img/check_icon.png" alt="" class="check">

        </div>
        <div class="nav">
            <nav>
                <ul>
                    <li>
                        <a href="">Home</a>
                    </li>
                    <li>
                        <a href="">About</a>
                    </li>
                    <li>
                        <a href="">Contact</a>
                    </li>
                    <li>
                        <a href="">Payment</a>
                    </li>
                </ul>
            </nav>
        </div>
        <div class="sign_log">
            <a href=""><img src="./img/Generic avatar.png" alt=""></a>
        </div>
    </header>
    <section>

        <div class="section1">
            <div class="profile">
                <input type="text" placeholder="Your name">
                <div class="email">
                    <i class="fa-regular fa-envelope" class="fa-envelope"></i> <input type="email" name="" id=""
                        placeholder="E-mail">
                </div>
                <div class="phone"><i class="fa-solid fa-phone"></i></i><input type="tel" name="phone"
                        placeholder="Phone" pattern="^\+[0-9]{1,3}\s?[0-9]{1,14}(\s[0-9]{1,13})?$"
                        title="Daxil edin: +<CountryCode> <PhoneNumber>" required>

                </div>
                <div class="adress">
                    <i class="fa-solid fa-location-dot" class=""></i><input type="text" placeholder="Address">
                </div>
            </div>

            <div class="textarea_1">

                <details>
                    <summary>
                        <span class="profile-text">Profile</span>
                        <img src="./img/arrow.png" class="custom-arrow" alt="arrow">
                    </summary>

                    <textarea id="profileInput" placeholder="New Entry" rows="5" cols="50"></textarea>
                </details>
            </div>
            <div class="textarea_2">
                <details>
                    <summary>
                        <span class="profile-text">Professional Experience</span>
                        <img src="./img/arrow.png" class="custom-arrow" alt="arrow">
                    </summary>
                    <textarea id="profileInput" placeholder="New Entry" rows="5" cols="50"></textarea>
                </details>
            </div>
            <div class="textarea_3">
                <details>
                    <summary>
                        <span class="profile-text">Professional Experience</span>
                        <img src="./img/arrow.png" class="custom-arrow" alt="arrow">
                    </summary>
                    <textarea id="profileInput" placeholder="New Entry" rows="5" cols="50"></textarea>
                </details>
            </div>
            <div class="textarea_4">
                <details>
                    <summary>
                        <span class="profile-text">Professional Experience</span>
                        <img src="./img/arrow.png" class="custom-arrow" alt="arrow">
                    </summary>
                    <textarea id="profileInput" placeholder="New Entry" rows="5" cols="50"></textarea>
                </details>
            </div>
            <div class="textarea_5">
                <details>
                    <summary>
                        <span class="profile-text">Certificates</span>
                        <img src="./img/arrow.png" class="custom-arrow" alt="arrow">
                    </summary>
                    <textarea id="profileInput" placeholder="New Entry" rows="5" cols="50"></textarea>
                </details>
            </div>

        </div>
        <div class="section2">
            <div class="send_custom">
                <button>Custom</button>
            </div>
            <div class="send_generate">
                <button>Add Content</button>
            </div>
            <div class="send_create">
                <a href="./Create_CV_AI.html">Create CV with AI</a>
            </div>



        </div>
        <div class="section3">
            <img src="./img/canva-blue-simple-professional-cv-resume-T9RPR4DPdiw 1.png" alt="">
            <div class="button">
                <button class="cvButton" id="generateCVBtn">Generate / View CV</button>
            </div>

            <div id="cvContainer">
                <!-- Backend-dən gələn link burda olmalıdır-->
            </div>






        </div>






    </section>













</body>

</html>
